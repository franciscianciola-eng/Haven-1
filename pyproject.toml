[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haven"
version = "1.2.0"
description = "An artificial creature built from scratch to meet the conditions scientific theories link to consciousness, with a language cortex of its own."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cortex = ["torch>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
haven = "haven.cli:main"

[tool.setuptools]
packages = ["haven", "haven.brain", "haven.cortex"]

[tool.setuptools.package-data]
haven = ["dashboard.html", "app.html", "static/*"]
"haven.cortex" = ["starter/*", "shelf.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
