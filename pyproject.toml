[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haven"
version = "0.1.0"
description = "A persistent AI mind that remembers, forms its own beliefs, and rewrites its own self-model as it grows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
haven = "haven.cli:main"

[tool.setuptools]
packages = ["haven"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Prompt paragraphs stay on one line: wrapping them would change what the model reads.
"haven/prompts.py" = ["E501"]
